name: ChargeDiag

options:
  bundleIdPrefix: com.qcj
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  ChargeDiag:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 充电诊断
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.5"
        CFBundleVersion: "6"
        UILaunchScreen: {}
        UIDeviceFamily: [1]
        # audio is the one that actually works: a silent playback session keeps
        # the process out of suspended state through a screen lock, so the log
        # stays continuous all night instead of recording sixty seconds of it.
        # fetch and processing remain as a fallback for when audio is refused.
        UIBackgroundModes:
          - audio
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.qcj.chargedign.sample
          - com.qcj.chargedign.process
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.qcj.chargedign
        PRODUCT_NAME: ChargeDiag
        MARKETING_VERSION: "1.5"
        CURRENT_PROJECT_VERSION: "6"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        SWIFT_EMIT_LOC_STRINGS: NO
